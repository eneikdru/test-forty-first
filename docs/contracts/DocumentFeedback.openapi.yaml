openapi: 3.0.3
info:
  title: Document Feedback API Contract
  description: |
    API contract specifically for Document Feedback (comments and actualization requests)
    for the Centralized Knowledge Base. Designed to support parallel backend and frontend
    development.
  version: 1.0.0
servers:
  - url: /api/v1
    description: v1 Base URL
paths:
  /documents/{id}/comments:
    get:
      summary: Get comments for document
      description: List discussions or feedback related to the document.
      tags:
        - Comments
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Comments successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '401':
          description: Unauthorized
        '404':
          description: Document not found

    post:
      summary: Post a comment on the document
      description: Add feedback, suggestions, or notes to a document.
      tags:
        - Comments
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  example: "Прошу проверить соответствие новой редакции ФГОС."
      responses:
        '201':
          description: Comment successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Document not found

  /documents/{id}/actualization-request:
    post:
      summary: Send request for document actualization
      description: Create a task/request indicating that a document needs review or updating.
      tags:
        - Documents
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  example: "Приказ Минздрава изменил требования к разделу Эпидемиология."
      responses:
        '201':
          description: Actualization request received successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    format: uuid
                  documentId:
                    type: string
                    format: uuid
                  requester:
                    $ref: '#/components/schemas/User'
                  reason:
                    type: string
                  status:
                    type: string
                    enum: [PENDING, APPROVED, REJECTED]
                    example: PENDING
                  createdAt:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized
        '404':
          description: Document not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserRole:
      type: string
      enum:
        - Administrator
        - Content-manager
        - Teacher
        - Student
      description: Mapped user permissions as per system requirements.
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "ca078170-df17-48f8-bca4-d89000a6e87f"
        username:
          type: string
          example: "ivan.ivanov@epidem.ru"
        fullName:
          type: string
          example: "Иванов Иван Иванович"
        role:
          $ref: '#/components/schemas/UserRole'
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        text:
          type: string
          example: "Прошу проверить соответствие новой редакции ФГОС."
        createdAt:
          type: string
          format: date-time
    ActualizationRequest:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        requester:
          $ref: '#/components/schemas/User'
        reason:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        createdAt:
          type: string
          format: date-time
